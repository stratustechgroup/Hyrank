name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'          # Triggers on version tags like v0.1.0
  workflow_dispatch:      # Allow manual trigger from GitHub UI

permissions:
  contents: write         # Needed to create GitHub Releases

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x plugin/gradlew

      - name: Build with Gradle
        working-directory: plugin
        run: ./gradlew clean build --no-daemon

      - name: Run tests
        working-directory: plugin
        run: ./gradlew test --no-daemon

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HyRank Vote Plugin v${{ steps.version.outputs.VERSION }}
          body: |
            ## HyRank Vote Plugin ${{ github.ref_name }}

            ### Installation
            1. Download `hyrank-vote-plugin-${{ steps.version.outputs.VERSION }}.jar`
            2. Drop into your Hytale server's `plugins/` directory
            3. Restart server — config is generated at `mods/HyRank/config.json`
            4. Fill in `apiKey`, `serverId`, and `hmacSecret` from your [HyRank Dashboard](https://hyrank.gg/dashboard)
            5. Restart again to apply

            See [docs/install.md](docs/install.md) for full setup instructions.
          files: plugin/build/libs/hyrank-vote-plugin-*.jar
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
